# Render configuration - atualizado para usar npm (mais estável que bun)
services:
  - type: web
    name: nfe-joalherias
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_KEY
        sync: false
      - key: ODOO_ENABLED
        value: "1"
      - key: ODOO_URL
        value: https://fiscal-cloud-joalherias.odoo.com
      - key: ODOO_DB
        value: fiscal-cloud-joalherias
      - key: ODOO_USER
        value: marcus@nytro.com.br
      - key: ODOO_API_KEY
        sync: false
      - key: ODOO_POLLING_MS
        value: "20000"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CERT_COLLECTION
        value: certificados
      - key: FIREBASE_CERT_DOC_ID
        value: joalheria-a1
      - key: NFE_EMISSAO_MODO
        value: proprio
      - key: NFE_UF
        value: PR
      - key: NFE_TP_AMB
        value: "2"
      - key: NFE_CERT_KEK
        sync: false
      - key: NFE_DANFE_PROVIDER
        value: local
      - key: NFE_TLS_INSECURE
        value: "0"
      - key: JOALHERIA_REGIME_TRIBUTARIO
        value: simples_nacional
      - key: JOALHERIA_OURO_CODIGO_NCM
        value: "71131900"
      - key: JOALHERIA_MOEDA_REF
        value: BRL

  # Cron para manter o serviço "acordado" e fazer polling
  - type: cron
    name: nfe-joalherias-keepalive
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"  # a cada 5 min
    buildCommand: "true"
    startCommand: "curl -fs -H 'x-api-key: $API_KEY' $RENDER_EXTERNAL_URL/api/v1/process-pending || true"
    envVars:
      - key: API_KEY
        sync: false
